<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antonio Otoni — Portfólio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       BASE (do seu index_portfolio)
       ========================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }

    body {
      overflow: hidden;
      font-family: "IBM Plex Sans", Arial, Helvetica, sans-serif;
      background: #123f4e;
      color: #fff;
    }

    /* =========================================================
       PÁGINA / FUNDO
       ========================================================= */
    .pagina {
      position: relative;
      width: 100vw;
      height: 100vh;

      background-image: url("midia/main2.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* camada escura opcional pra dar contraste ao texto do topo */
    .pagina::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.15) 35%,
        rgba(0,0,0,0.0) 60%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* =========================================================
       NAVBAR DO TOPO
       ========================================================= */
    .topnav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 30;
      padding: 16px 0;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .topnav .wrap {
      width: min(1200px, 92%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .brand {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: #fff;
      text-decoration: none;
    }
    .navlinks { list-style: none; display: flex; gap: 26px; }
    .navlinks a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color .2s;
    }
    .navlinks a:hover { color: #fff; }
    .navlinks a.active { color: #7fd1ff; }

    /* =========================================================
       COLUNA DE BOTÕES (à direita)
       – aqui ficam os botões que você pode distribuir
       ========================================================= */
    .projetos {
      position: absolute;
      right: 5%;
      top: 40%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(360px, 32vw);
      z-index: 5;
    }

    .projeto {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 14px 22px;

      background: rgba(18, 63, 78, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;

      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;

      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .projeto:hover {
      transform: translateX(-8px);
      background: rgba(40, 43, 205, 0.95);
      border-color: rgba(255,255,255,0.8);
    }

    /* destaque para o botão principal "Ver projetos" */
    .projeto.primary {
      background: rgba(40, 78, 205, 0.95);
      border-color: rgba(255,255,255,0.7);
    }
    .projeto.primary:hover {
      background: rgba(60, 165, 225, 1);
    }

    /* botões menores (curriculo, contato) */
    .projeto.small {
      min-height: 50px;
      font-size: 14px;
      padding: 10px 18px;
    }

    /* separador visual entre grupos */
    .projeto-sep {
      height: 1px;
      background: rgba(255,255,255,0.2);
      margin: 4px 8px;
    }

    /* =========================================================
       RESPONSIVO
       ========================================================= */
    @media (max-width: 700px) {
      .topnav { padding: 12px 0; }
      .brand { font-size: 16px; }
      .navlinks { gap: 16px; }
      .navlinks a { font-size: 14px; }

      .projetos {
        width: 84%;
        right: 8%;
        top: auto;
        bottom: 6%;
        transform: none;
        gap: 10px;
      }
      .projeto { min-height: 54px; font-size: 15px; }
      .projeto:hover { transform: none; }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       NAVBAR DO TOPO (vinda do index.html)
       ========================================================= -->
  <nav class="topnav">
    <div class="wrap">

      <ul class="navlinks">
        <li><a class="active" href="index.html">Sobre</a></li>
        <li><a href="projetos.html">Projetos</a></li>
      </ul>
    </div>
  </nav>

  <!-- =========================================================
       CAPA
       ========================================================= -->
  <main class="pagina">

    <!-- COLUNA DE BOTÕES — distribua aqui como quiser -->
    <div class="projetos">

      <!-- botão principal -->
      <a class="projeto primary" href="projetos.html">Ver projetos →</a>

    </div>

  </main>

</body>
</html>
